<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Potato Share</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        a.nostyle {
            text-decoration: inherit;
            font-family: inherit;
            font-weight: inherit;
            font-size: inherit;
            color: inherit;
        }

        body {
            font-family: sans-serif;
            background-color: #eee;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        h1 {
            font-weight: normal;
            font-size: larger;
            color: #313B46;
            margin: 0;
            white-space: nowrap;
        }

        h2 {
            margin-top: 8px;
            margin-bottom: 8px;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            position: relative;
            padding: 32px;
            border-radius: 20px;
            width: 100%;
            max-width: 800px;
            min-height: 400px;
            background-color: #fff;
            box-shadow: 0px 8px 24px rgba(0, 0, 0, 0.05);
        }

        .vert-align-center {
            display: flex;
            align-items: center;
        }

        .login-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        a {
            text-decoration: none;
            color: #313B46;
            transition: all 0.5s;
        }

        a:hover {
            color: #697e96;
        }

        ul {
            list-style-type: none;
            padding-left: 0;
        }

        .btn-login-bottom-right {
            position: absolute;
            bottom: 32px;
            right: 32px;
            background-color: #8ea7c1;
            color: #000000;
            border: none;
            border-radius: 8px;
            padding: 8px 18px;
            font-family: sans-serif;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn-login-bottom-right:hover {
            background-color: #7893af;
        }

        .btn-login-bottom-right:active {
            transform: scale(0.98);
        }

        @media (max-width: 768px) {
            .content {
                display: flex;
                flex-direction: column;
                min-height: auto;
                padding: 24px;
                padding-bottom: 80px;
            }

            .login-form input[type="password"] {
                height: 50px !important;
            }
        }
    </style>
</head>

<body>
    <div class="content">
        <div>
            <h1>Potato Share</h1>
            <h2>Sign in</h2>
            <p>Use your password.</p>
        </div>

        <div class="vert-align-center">
            <form action="/login" method="POST" class="login-form">
                <input type="password" name="password" placeholder="Password" required
                    style="height: 60px; width: 100%; border-radius: 5px; border: 1px solid black; padding: 0 12px; font-size: 16px;">
                
                <span style="font-size: 12px; color: #666; line-height: 1.4;">
                    This is the password set in the Admin panel. If you've lost your password, kill the server and restart it. The password 'potato' will be automatically added. Be sure to delete that once you're in.
                </span>

                <button type="submit" class="btn-login-bottom-right">Log in</button>
            </form>
        </div>
    </div>
</body>

</html>
