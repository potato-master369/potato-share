<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Potato Share</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        a.nostyle {
            text-decoration: inherit;
            font-family: inherit;
            font-weight: inherit;
            font-size: inherit;
            color: inherit;
        }

        body {
            font-family: sans-serif;
            background-color: #eee;
        }

        h1 {
            font-weight: normal;
            font-size: larger;
            color: #313B46;
            margin: 0;
            white-space: nowrap;
        }

        .topbar {
            padding: 10px 20px;
            background-color: #eee;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
            min-height: 60px;
        }

        .topbar-ralign-content {
            display: flex;
            justify-content: flex-end;
        }

        table td,
        th {
            padding: 20px 20px;
        }

        .dropdown {
            position: relative;
            display: inline-block;
        }

        .signed-in-as {
            font-weight: normal;
            font-size: medium;
            text-decoration: none;
            cursor: pointer;
            background-color: inherit;
            outline: none;
            border: none;
            color: black;
            padding: 5px 10px;
        }

        .signin-overflow {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            background-color: #f9f9f9;
            min-width: 160px;
            box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.2);
            z-index: 20;
            border-radius: 4px;
            overflow: hidden;
        }

        .signin-overflow a {
            color: #313B46;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
        }

        .signin-overflow a:hover {
            background-color: #f1f1f1;
        }

        .signin-overflow button.dropdown-btn {
            width: 100%;
            text-align: left;
            background: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-size: inherit;
            color: #313B46;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
        }

        .signin-overflow button.dropdown-btn:hover {
            background-color: #f1f1f1;
        }

        .dropdown:hover .signin-overflow {
            display: block;
        }

        .dropdown:hover .signed-in-as {
            color: #313B46;
        }

        .content {
            outline: 20px solid #eee;
            position: fixed;
            top: 60px;
            left: 50px;
            padding: 20px;
            border-radius: 20px;
            width: calc(100% - 100px);
            height: max(100%, fit-content);
            background-color: #fff;
        }

        a {
            text-decoration: none;
            color: #313B46;
            transition: all 0.5s;
        }

        a:hover {
            color: #697e96;
        }

        ul {
            list-style-type: none;
            padding-left: 0;
        }
    </style>
</head>

<body>
    <div class="topbar">
        <h1><a href="/" class="nostyle">Potato Share</a></h1>
        <div class="topbar-ralign-content">
            <div class="dropdown">
                <button class="signed-in-as">Sign-in options</button>
                <div class="signin-overflow">
                    <a href="/login">Log In</a>
                    <a href="/logout">Log out</a>
                </div>
            </div>
        </div>
    </div>
    <div style="height: 60px;"></div>
    <div class="content">
        <h1>Administrate</h1>
        <form action="/passwd-create" method="POST">
            <input type="text" name="passwd" placeholder="New password" required>
            <select name="perms">
                <option value="admin">Admin</option>
                <option value="user">User</option>
                <option value="ro">Read-only</option>
            </select>
            <button type="submit">Create</button>
        </form>
        <table>
            <tr>
                <th>Password</th>
                <th>Perms</th>
                <th>Action</th>
            </tr>
            {{range .Passwords}}
            <tr>
                <td>{{.Password}}</td>
                <td>{{.Perms}}</td>
                <td>
                    <a href="/passwd-delete/{{.Password}}">Delete</a>
                </td>
            </tr>
            {{end}}
        </table>
    </div>

</body>

</html>
