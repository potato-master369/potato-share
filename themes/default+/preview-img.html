<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
	<title>Preview of {{ .Name }}</title>
	<style>
		*,
		*::before,
		*::after {
			box-sizing: border-box;
		}

		a.nostyle {
			text-decoration: inherit;
			font-family: inherit;
			font-weight: inherit;
			font-size: inherit;
			color: inherit;
		}

		body {
			font-family: sans-serif;
			background-color: #eee;
			padding: 0;
		}

		h1 {
			font-weight: normal;
			font-size: larger;
			color: #313B46;
			margin: 0;
			white-space: nowrap;
		}

		.topbar {
			padding: 10px 20px;
			background-color: #eee;
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			display: flex;
			align-items: center;
			justify-content: space-between;
			z-index: 10;
			min-height: 60px;
			z-index: 99;
		}

		.topbar-ralign-content {
			display: flex;
			justify-content: flex-end;
		}

		.dropdown {
			position: relative;
			display: inline-block;
			z-index: 99;
		}

		.signed-in-as {
			font-weight: normal;
			font-size: medium;
			text-decoration: none;
			cursor: pointer;
			background-color: inherit;
			outline: none;
			border: none;
			color: black;
			padding: 5px 10px;
		}

		.signin-overflow {
			display: none;
			position: absolute;
			right: 0;
			top: 100%;
			background-color: #f9f9f9;
			min-width: 160px;
			box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.2);
			z-index: 20;
			border-radius: 4px;
			overflow: hidden;
			z-index: 99;
		}

		.signin-overflow a {
			color: #313B46;
			padding: 12px 16px;
			text-decoration: none;
			display: block;

		}

		.signin-overflow a:hover {
			background-color: #f1f1f1;
			z-index: 99;
		}

		.signin-overflow button.dropdown-btn {
			width: 100%;
			text-align: left;
			background: none;
			border: none;
			cursor: pointer;
			font-family: inherit;
			font-size: inherit;
			color: #313B46;
			padding: 12px 16px;
			text-decoration: none;
			display: block;
		}

		.signin-overflow button.dropdown-btn:hover {
			background-color: #f1f1f1;
		}


		.content {
			outline: 20px solid #eee;
			position: fixed;
			top: 60px;
			left: 50px;
			padding: 20px;
			border-radius: 20px;
			width: calc(100% - 100px);
			height: max(100%, fit-content);
			background-color: #fff;
		}

		img {
			display: block;
			position: fixed;
			top: calc(60px + (100vh - 60px) / 2);
			left: 50%;
			transform: translate(-50%, -50%);
			max-height: calc(100vh - 100px);
			object-fit: contain;
			height: auto;
			width: min(800px, 80vw);
			border: 1px solid #313B46;
			margin-top: 10px;
			z-index: 69;
		}

		.invisible-overlay {
			position: absolute;
			top: 60px;
			left: 0px;
			width: 100vw;
			height: calc(100vh - 60px);
			background-color: rgba(0, 0, 0, 0.8);
			z-index: 67;
			margin: 0;
		}

		.invisible-overlay-2 {
			display: none;
			position: absolute;
			top: 0px;
			left: 0px;
			width: 100vw;
			height: 100vh;
			background-color: rgba(0, 0, 0, 0.4);
			z-index: 100;
			margin: 0;
		}

		.actually-invisible-overlay {
			display: none;
			position: absolute;
			top: 60px;
			left: 0px;
			width: 100vw;
			height: calc(100vh - 60px);
			background-color: rgba(0, 0, 0, 0);
			z-index: 98;
			margin: 0;
		}

		#login-options-flyout:target~.actually-invisible-overlay {
			display: block;
		}

		#file-info-flyout:target ~ .invisible-overlay-2 {
			display: block;
		}

		#login-options-flyout:target {
			display: block;
		}

		.preview-label {
			position: fixed;
			top: 80px;
			left: 20px;
			font-size: xx-large;
			color: #fff;
			z-index: 70;
			text-shadow:
				2px 2px 4px black,
				-2px -2px 4px black,
				2px -2px 4px black,
				-2px 2px 4px black;
		}

		.info-button {
			background-color: #004dff;
			padding: 12px 14px;
			border-radius: calc(0.5em + 24px);
			color: #fff;
			text-decoration: none;
			text-shadow: none;
			font-size: large;
			margin-left: 10px;
		}

		.file-info-window {
			display: none;
			position: absolute;
			width: fit-content;
			height: fit-content;
			padding: 40px;
			left: 50%;
			top: 50%;
			transform: translate(-50%, -50%);
			background-color: #fff;
			border-radius: 15px;
			z-index: 101;
		}

		.file-info-window:target {
			display: block;
		}

		.close-button {
			position: absolute;
			top: 12px;
			right: 12px;
			width: 28px;
			height: 28px;
			display: flex;
			align-items: center;
			justify-content: center;
			text-decoration: none;
			background-color: rgba(0, 0, 0, 0.2);
			color: #fff;
			border-radius: 50%;
			transition: all 0.2s;
		}
	</style>
</head>

<body>
	<div class="invisible-overlay"></div>
	<div class="file-info-window" id="file-info-flyout">
		<a class="close-button" href="#"><i class="fa-solid fa-xmark"></i></a>
		<h1>Preview of {{ .Name }}</h1>
		File information:

		<table>
			<tr>
				<th>File Name</th>
				<td>{{ .Name }}</td>
			</tr>
			<tr>
				<th>File Size</th>
				<td>{{ .Size }}</td>
			</tr>
			<tr>
				<th>Last Modified</th>
				<td>{{ .ModTime }}</td>
			</tr>
		</table>
	</div>
	<div class="invisible-overlay-2"></div>

	<div class="topbar">
		<h1><a href="/" class="nostyle">Potato Share</a></h1>
		<div class="topbar-ralign-content">
			<div class="dropdown">
				<a class="signed-in-as" href="#login-options-flyout">Sign-in options</a>

				<div class="signin-overflow" id="login-options-flyout">
					<a href="/login">Log In</a>
					<a href="/logout">Log out</a>
				</div>
				<a class="actually-invisible-overlay" href="#"></a>
			</div>
		</div>
	</div>
	<div style="height: 60px;"></div>

	<span class="preview-label"><i class="fa-solid fa-image" style="color: #ff3300"></i> {{ .Name }} <a
			class="info-button" href="#file-info-flyout">File Info</a></span>
	<img src="{{ .URL }}" alt="Preview of {{ .Name }}">
</body>

</html>
